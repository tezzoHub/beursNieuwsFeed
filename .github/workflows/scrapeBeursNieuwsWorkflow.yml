:name: scrapeBeursNieuwsWorkflow

on:
  schedule:
    - cron: "*/30 * * * *"   # elke 30 minuten
  workflow_dispatch:         # handmatig starten

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python src/scraper.py

      - name: Ensure correct remote
        run: git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nieuws.json
          git commit -m "Update nieuws.json" || exit 0
          git push origin HEAD:main
